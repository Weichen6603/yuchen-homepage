<!-- An opt-in, non-modal desktop pet. It never captures clicks outside its controls. -->
<div id="little-yuchen" class="little-pet" data-bughunt data-state="dormant" hidden>
  <div class="pet-dialog" id="pet-dialog" role="dialog" aria-modal="false" aria-labelledby="pet-dialog-title" aria-describedby="pet-dialog-copy" hidden>
    <button class="pet-dialog-close" type="button" data-pet-action="dismiss" aria-label="Close conversation">×</button>
    <span class="pet-dialog-kicker">LITTLE YUCHEN</span>
    <h2 id="pet-dialog-title">Bug hunt?</h2>
    <p id="pet-dialog-copy">A few tiny bugs are hiding on this page. Shall we catch them?</p>
    <div class="pet-dialog-actions">
      <button class="pet-primary" type="button" data-pet-action="start">Let's go!</button>
      <button class="pet-secondary" type="button" data-pet-action="dismiss">Maybe later</button>
    </div>
    <button class="pet-sleep-link" type="button" data-pet-action="sleep">Let me nap</button>
  </div>
  <div class="pet-hud" id="pet-hud" aria-label="Bug Hunt progress" hidden>
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    <span class="pet-score">0 / 5</span>
    <button type="button" data-pet-action="end" aria-label="End Bug Hunt" title="End game (Esc)">×</button>
  </div>
  <!-- One-shot delivery: a small portal and soft-jawed cartoon gripper.
       Decorative only: no pointer capture or extra tab stops. -->
  <div class="pet-delivery" aria-hidden="true">
    <span class="pet-landing-shadow"></span>
    <div class="pet-crane-window">
      <svg class="pet-gripper" viewBox="0 0 96 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="gripper-stem" d="M48 -30V15" stroke="#555253" stroke-width="5" stroke-linecap="round"/>
        <path d="M48 -30V13" stroke="#d9d6d0" stroke-width="2"/>
        <g class="gripper-jaw gripper-jaw-left">
          <path d="M32 29 15 44 15 64 27 73" stroke="#514d4c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M32 29 15 44 15 64 27 73" stroke="#e9e5de" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m24 70 5 4" stroke="#d59658" stroke-width="8" stroke-linecap="round"/>
          <circle cx="15" cy="44" r="4.5" fill="#b5b1ac" stroke="#514d4c" stroke-width="1.8"/>
        </g>
        <g class="gripper-jaw gripper-jaw-right">
          <path d="M64 29 81 44 81 64 69 73" stroke="#514d4c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M64 29 81 44 81 64 69 73" stroke="#e9e5de" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m72 70-5 4" stroke="#d59658" stroke-width="8" stroke-linecap="round"/>
          <circle cx="81" cy="44" r="4.5" fill="#b5b1ac" stroke="#514d4c" stroke-width="1.8"/>
        </g>
        <rect x="25" y="10" width="46" height="28" rx="12" fill="#f8f5ef" stroke="#514d4c" stroke-width="2.2"/>
        <path d="M34 16h28" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <rect x="35" y="20" width="26" height="11" rx="5.5" fill="#555253"/>
        <circle cx="42" cy="25" r="1.6" fill="#f0c584"/>
        <circle cx="54" cy="25" r="1.6" fill="#f0c584"/>
        <circle cx="30" cy="27" r="1.5" fill="#c9c4bc"/>
        <circle cx="66" cy="27" r="1.5" fill="#c9c4bc"/>
      </svg>
    </div>
    <span class="pet-portal"><span class="pet-portal-core"></span><span class="pet-portal-orbit"></span></span>
    <span class="portal-speck portal-speck-one"></span><span class="portal-speck portal-speck-two"></span><span class="portal-speck portal-speck-three"></span>
  </div>

  <button class="pet-character" type="button" aria-label="Little Yuchen: talk and play Bug Hunt" aria-expanded="false" aria-controls="pet-dialog">
    <span class="pet-art" aria-hidden="true">
      <img class="pet-body" src="assets/pet/body.webp" alt="" width="146" height="120" draggable="false" />
      <img class="pet-arms" src="assets/pet/arms.webp" alt="" width="146" height="120" draggable="false" />
      <img class="pet-happy" src="assets/pet/happy.webp" alt="" width="133" height="122" draggable="false" />
      <span class="pet-muzzle"></span>
    </span>
    <span class="pet-whisper">Psst…</span>
  </button>
  <button class="pet-hide" type="button" data-pet-action="sleep" aria-label="Hide Little Yuchen" title="Let me nap">×</button>
</div>
<div id="pet-game-layer" data-bughunt aria-label="Bug Hunt targets" hidden></div>
<div id="pet-effects" data-bughunt aria-hidden="true"></div>
<div id="pet-announcer" class="sr-only" data-bughunt aria-live="polite" aria-atomic="true"></div>
